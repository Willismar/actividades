<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades Académicas</title>
<meta name="theme-color" content="#052e1c">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f0f8f3; --card:#ffffff; --border:#dcefe1;
    --azul:#15803d; --azulOscuro:#052e1c; --cian:#22c55e; --cian2:#4ade80;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --radius:14px; --shadow:0 2px 16px rgba(21,128,61,.08); --shadowG:0 8px 32px rgba(21,128,61,.15);
    --font:'Plus Jakarta Sans',sans-serif;
    --rojo:#ef4444; --naranja:#f97316; --amarillo:#eab308; --verde:#16a34a; --gris:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  header{
    background:var(--azulOscuro);padding:0 20px;height:64px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(5,46,28,.2);
  }
  .logo{display:flex;align-items:center;gap:12px;}
  .logo-icon{width:38px;height:38px;background:var(--cian);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0;}
  .logo-text{font-weight:800;font-size:17px;color:#fff;}
  .logo-text span{color:var(--cian2);}
  #sync-status{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;white-space:nowrap;}

  main{max-width:1180px;margin:0 auto;padding:22px 18px 90px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,var(--azul));}
  .stat-card .num{font-size:26px;font-weight:900;line-height:1;}
  .stat-card .label{font-size:11.5px;color:var(--text2);margin-top:4px;font-weight:600;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar select, .toolbar input[type=text]{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;font-family:var(--font);font-size:13px;color:var(--text);font-weight:600;
  }
  .toolbar input[type=text]{flex:1;min-width:160px;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:var(--font);font-weight:700;
    font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--azul);color:#fff;}
  .btn-primary:hover{background:#12692f;}
  .btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--azul);color:var(--azul);}
  .btn-icon{padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text3);}
  .btn-icon:hover{border-color:var(--azul);color:var(--azul);}
  .spacer{flex:1;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .empty{text-align:center;padding:60px 20px;color:var(--text3);}
  .empty .e-icon{font-size:40px;margin-bottom:10px;}

  .act-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  }
  .act-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--urg,var(--verde));}
  .act-main{padding-left:6px;min-width:0;}
  .act-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px;}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em;}
  .badge-curso{background:#e8f9ef;color:var(--azul);}
  .badge-asig{background:#eef2ff;color:#4338ca;}
  .badge-done{background:#e8f9ef;color:var(--verde);}
  .act-title{font-weight:800;font-size:15px;margin-bottom:2px;}
  .act-sub{font-size:12.5px;color:var(--text2);}
  .act-dates{font-size:11.5px;color:var(--text3);margin-top:4px;}
  .act-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .tiempo-badge{font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap;color:#fff;background:var(--urg,var(--verde));}
  .act-actions{display:flex;gap:6px;}

  @media(max-width:640px){
    .act-card{grid-template-columns:1fr;}
    .act-right{flex-direction:row;justify-content:space-between;align-items:center;}
  }

  /* MODAL */
  .overlay{display:none;position:fixed;inset:0;background:rgba(5,46,28,.5);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadowG);}
  .modal h2{font-size:18px;font-weight:800;color:var(--azul);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
  .field input,.field select{
    width:100%;background:#f8fafc;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;font-family:var(--font);font-size:13.5px;color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--azul);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--azulOscuro);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;
    font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:999;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">A</div>
    <div class="logo-text">Actividades<span> Académicas</span></div>
  </div>
  <span id="sync-status">☁️ Sincronizando...</span>
</header>

<main>
  <div class="stat-row">
    <div class="stat-card" style="--accent:var(--azul)"><div class="num" id="st-total">0</div><div class="label">Total actividades</div></div>
    <div class="stat-card" style="--accent:var(--rojo)"><div class="num" id="st-urgente" style="color:var(--rojo)">0</div><div class="label">Urgentes (≤1 día)</div></div>
    <div class="stat-card" style="--accent:var(--amarillo)"><div class="num" id="st-semana" style="color:#b45309">0</div><div class="label">Esta semana</div></div>
    <div class="stat-card" style="--accent:var(--verde)"><div class="num" id="st-completa" style="color:var(--verde)">0</div><div class="label">Completadas</div></div>
  </div>

  <div class="toolbar">
    <select id="f-semestre"><option value="">Semestre: todos</option></select>
    <select id="f-paralelo"><option value="">Paralelo: todos</option></select>
    <select id="f-estudiante"><option value="">Estudiante: todos</option></select>
    <select id="f-asignatura"><option value="">Asignatura: todas</option></select>
    <input type="text" id="f-buscar" placeholder="Buscar actividad...">
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="btn-ocultar-completas">Ocultar completadas</button>
    <button class="btn btn-primary" onclick="abrirModal()">＋ Nueva actividad</button>
  </div>

  <div class="list" id="lista"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Nueva actividad</h2>
    <div class="field-row">
      <div class="field">
        <label>Semestre</label>
        <select id="m-semestre"></select>
      </div>
      <div class="field">
        <label>Paralelo</label>
        <select id="m-paralelo">
          <option>C1</option><option>C2</option><option>C3</option><option>C4</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Estudiante</label>
      <input type="text" id="m-estudiante" placeholder="Nombre del estudiante">
    </div>
    <div class="field">
      <label>Asignatura</label>
      <input type="text" id="m-asignatura" placeholder="Ej: Auditoría de TI">
    </div>
    <div class="field">
      <label>Actividad</label>
      <input type="text" id="m-actividad" placeholder="Ej: S3-Taller_1">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Fecha de apertura</label>
        <input type="date" id="m-apertura">
      </div>
      <div class="field">
        <label>Fecha de cierre</label>
        <input type="date" id="m-cierre">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarActividad()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── FIREBASE (mismo proyecto que Willismar Tareas, colección separada) ──
const firebaseConfig = {
  apiKey: "AIzaSyAUvMWFnuaNXmyh7rjvLPNgjtiS0qQWYGM",
  authDomain: "tecnico-pro.firebaseapp.com",
  projectId: "tecnico-pro",
  storageBucket: "tecnico-pro.firebasestorage.app",
  messagingSenderId: "883534120062",
  appId: "1:883534120062:web:72b5343763fd1d3582442f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FB_COLLECTION = 'actividades-academicas';
const FB_DOC = 'main';

let actividades = JSON.parse(localStorage.getItem('act_academicas') || '[]');
let editandoId = null;
let ocultarCompletas = false;

function guardarLocal(){ localStorage.setItem('act_academicas', JSON.stringify(actividades)); }

function fbGuardar(){
  db.collection(FB_COLLECTION).doc(FB_DOC).set({
    actividades, updated: new Date().toISOString()
  }).then(()=>setSync('☁️ Guardado en la nube'))
    .catch(e=>{ setSync('⚠️ Sin conexión'); console.warn('FB save:', e); });
}

function fbCargar(){
  setSync('⏳ Sincronizando...');
  db.collection(FB_COLLECTION).doc(FB_DOC).get().then(snap=>{
    if(snap.exists){
      const d = snap.data();
      if(d.actividades){ actividades = d.actividades; guardarLocal(); }
      renderTodo();
      setSync('☁️ Sincronizado');
    } else { setSync('☁️ Nube lista'); }
  }).catch(e=>{ setSync('⚠️ Sin conexión'); console.warn('FB load:', e); });
}

function setSync(msg){ document.getElementById('sync-status').textContent = msg; }

// ─── TIEMPO RESTANTE ───────────────────────────────────────────
function calcularUrgencia(act){
  if(act.entregada) return { label:'Completada', color:'var(--gris)', dias:Infinity, vencida:false };
  const ahora = new Date();
  const cierre = new Date(act.cierre + 'T23:59:59');
  const msRestante = cierre - ahora;
  if(msRestante < 0){
    return { label:'Venció', color:'var(--gris)', dias:-1, vencida:true };
  }
  const dias = Math.floor(msRestante / (1000*60*60*24));
  const horas = Math.floor((msRestante % (1000*60*60*24)) / (1000*60*60));
  let color;
  if(dias <= 0) color = 'var(--rojo)';
  else if(dias === 1) color = 'var(--naranja)';
  else if(dias <= 3) color = 'var(--amarillo)';
  else color = 'var(--verde)';
  return { label:`Faltan ${dias} día${dias===1?'':'s'} y ${horas} h`, color, dias, vencida:false };
}

// ─── RENDER ────────────────────────────────────────────────────
function fillSelects(){
  const semSel = document.getElementById('m-semestre');
  if(!semSel.options.length){
    for(let i=1;i<=10;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'° semestre'; semSel.appendChild(o); }
  }
  const fSem = document.getElementById('f-semestre');
  const semActual = fSem.value;
  fSem.innerHTML = '<option value="">Semestre: todos</option>';
  for(let i=1;i<=10;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'° semestre'; fSem.appendChild(o); }
  fSem.value = semActual;

  const fPar = document.getElementById('f-paralelo');
  const parActual = fPar.value;
  fPar.innerHTML = '<option value="">Paralelo: todos</option>' + ['C1','C2','C3','C4'].map(p=>`<option>${p}</option>`).join('');
  fPar.value = parActual;

  const estudiantes = [...new Set(actividades.map(a=>a.estudiante).filter(Boolean))].sort();
  const fEst = document.getElementById('f-estudiante');
  const estActual = fEst.value;
  fEst.innerHTML = '<option value="">Estudiante: todos</option>' + estudiantes.map(e=>`<option>${e}</option>`).join('');
  fEst.value = estActual;

  const asignaturas = [...new Set(actividades.map(a=>a.asignatura).filter(Boolean))].sort();
  const fAsig = document.getElementById('f-asignatura');
  const asigActual = fAsig.value;
  fAsig.innerHTML = '<option value="">Asignatura: todas</option>' + asignaturas.map(a=>`<option>${a}</option>`).join('');
  fAsig.value = asigActual;
}

function renderLista(){
  const fSem = document.getElementById('f-semestre').value;
  const fPar = document.getElementById('f-paralelo').value;
  const fEst = document.getElementById('f-estudiante').value;
  const fAsig = document.getElementById('f-asignatura').value;
  const fBuscar = document.getElementById('f-buscar').value.trim().toLowerCase();

  let filtradas = actividades.filter(a=>{
    if(fSem && String(a.semestre) !== fSem) return false;
    if(fPar && a.paralelo !== fPar) return false;
    if(fEst && a.estudiante !== fEst) return false;
    if(fAsig && a.asignatura !== fAsig) return false;
    if(fBuscar && !(a.actividad.toLowerCase().includes(fBuscar) || a.asignatura.toLowerCase().includes(fBuscar))) return false;
    if(ocultarCompletas && a.entregada) return false;
    return true;
  });

  filtradas.sort((a,b)=>{
    const ua = calcularUrgencia(a), ub = calcularUrgencia(b);
    if(a.entregada !== b.entregada) return a.entregada ? 1 : -1;
    if(ua.vencida !== ub.vencida) return ua.vencida ? 1 : -1;
    return ua.dias - ub.dias;
  });

  const lista = document.getElementById('lista');
  if(!filtradas.length){
    lista.innerHTML = `<div class="empty"><div class="e-icon">📋</div>No hay actividades que coincidan con el filtro.</div>`;
    return;
  }

  lista.innerHTML = filtradas.map(a=>{
    const urg = calcularUrgencia(a);
    return `
    <div class="act-card" style="--urg:${urg.color}">
      <div class="act-main">
        <div class="act-top">
          <span class="badge badge-curso">${a.semestre}° · ${a.paralelo}</span>
          <span class="badge badge-asig">${escapeHtml(a.asignatura)}</span>
          ${a.entregada ? '<span class="badge badge-done">✔ Completada</span>' : ''}
        </div>
        <div class="act-title">${escapeHtml(a.actividad)}</div>
        <div class="act-sub">🧑‍🎓 ${escapeHtml(a.estudiante || 'Sin asignar')}</div>
        <div class="act-dates">Apertura: ${fmt(a.apertura)} &nbsp;·&nbsp; Cierre: ${fmt(a.cierre)}</div>
      </div>
      <div class="act-right">
        <span class="tiempo-badge" style="--urg:${urg.color}">${urg.label}</span>
        <div class="act-actions">
          <button class="btn-icon" title="${a.entregada?'Marcar pendiente':'Marcar completada'}" onclick="toggleEntregada('${a.id}')">${a.entregada?'↺':'✔'}</button>
          <button class="btn-icon" title="Editar" onclick="abrirModal('${a.id}')">✎</button>
          <button class="btn-icon" title="Eliminar" onclick="eliminarActividad('${a.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderStats(){
  document.getElementById('st-total').textContent = actividades.length;
  document.getElementById('st-urgente').textContent = actividades.filter(a=>!a.entregada && calcularUrgencia(a).dias<=1 && !calcularUrgencia(a).vencida).length;
  document.getElementById('st-semana').textContent = actividades.filter(a=>!a.entregada && calcularUrgencia(a).dias>=0 && calcularUrgencia(a).dias<=7).length;
  document.getElementById('st-completa').textContent = actividades.filter(a=>a.entregada).length;
}

function renderTodo(){ fillSelects(); renderLista(); renderStats(); }

function fmt(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ─── CRUD ──────────────────────────────────────────────────────
function abrirModal(id){
  editandoId = id || null;
  document.getElementById('modal-title').textContent = id ? 'Editar actividad' : 'Nueva actividad';
  if(id){
    const a = actividades.find(x=>x.id===id);
    document.getElementById('m-semestre').value = a.semestre;
    document.getElementById('m-paralelo').value = a.paralelo;
    document.getElementById('m-estudiante').value = a.estudiante;
    document.getElementById('m-asignatura').value = a.asignatura;
    document.getElementById('m-actividad').value = a.actividad;
    document.getElementById('m-apertura').value = a.apertura;
    document.getElementById('m-cierre').value = a.cierre;
  } else {
    ['m-estudiante','m-asignatura','m-actividad','m-apertura','m-cierre'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('m-semestre').value = 1;
    document.getElementById('m-paralelo').value = 'C1';
  }
  document.getElementById('overlay').classList.add('show');
}
function cerrarModal(){ document.getElementById('overlay').classList.remove('show'); editandoId = null; }

function guardarActividad(){
  const semestre = document.getElementById('m-semestre').value;
  const paralelo = document.getElementById('m-paralelo').value;
  const estudiante = document.getElementById('m-estudiante').value.trim();
  const asignatura = document.getElementById('m-asignatura').value.trim();
  const actividad = document.getElementById('m-actividad').value.trim();
  const apertura = document.getElementById('m-apertura').value;
  const cierre = document.getElementById('m-cierre').value;

  if(!asignatura || !actividad || !cierre){
    toast('Completa al menos asignatura, actividad y fecha de cierre', 'warn');
    return;
  }

  if(editandoId){
    const a = actividades.find(x=>x.id===editandoId);
    Object.assign(a, { semestre, paralelo, estudiante, asignatura, actividad, apertura, cierre });
  } else {
    actividades.push({
      id: 'a' + Date.now() + Math.random().toString(36).slice(2,7),
      semestre, paralelo, estudiante, asignatura, actividad, apertura, cierre, entregada:false
    });
  }
  guardarLocal(); fbGuardar(); renderTodo(); cerrarModal();
  toast('Actividad guardada');
}

function eliminarActividad(id){
  if(!confirm('¿Eliminar esta actividad?')) return;
  actividades = actividades.filter(a=>a.id!==id);
  guardarLocal(); fbGuardar(); renderTodo();
  toast('Actividad eliminada', 'warn');
}

function toggleEntregada(id){
  const a = actividades.find(x=>x.id===id);
  a.entregada = !a.entregada;
  guardarLocal(); fbGuardar(); renderTodo();
}

function toast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = tipo==='warn' ? 'var(--naranja)' : 'var(--azulOscuro)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ─── EVENTOS ───────────────────────────────────────────────────
['f-semestre','f-paralelo','f-estudiante','f-asignatura'].forEach(id=>{
  document.getElementById(id).addEventListener('change', renderLista);
});
document.getElementById('f-buscar').addEventListener('input', renderLista);
document.getElementById('btn-ocultar-completas').addEventListener('click', function(){
  ocultarCompletas = !ocultarCompletas;
  this.textContent = ocultarCompletas ? 'Mostrar completadas' : 'Ocultar completadas';
  renderLista();
});
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') cerrarModal(); });

// ─── INIT ──────────────────────────────────────────────────────
renderTodo();
fbCargar();
setInterval(renderLista, 60000); // refresca el tiempo restante cada minuto
</script>
</body>
</html>

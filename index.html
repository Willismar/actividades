<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Willismar</title>

<!-- PWA -->
<meta name="application-name" content="Agenda Willismar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="theme-color" content="#052e1c">
<meta name="description" content="Agenda diaria, actividades académicas y reparaciones">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-actividades-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-actividades-192.png">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f0f8f3; --card:#ffffff; --border:#dcefe1;
    --azul:#15803d; --azulOscuro:#052e1c; --cian:#22c55e; --cian2:#4ade80;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --radius:14px; --shadow:0 2px 16px rgba(21,128,61,.08); --shadowG:0 8px 32px rgba(21,128,61,.15);
    --font:'Plus Jakarta Sans',sans-serif;
    --rojo:#ef4444; --naranja:#f97316; --amarillo:#eab308; --verde:#16a34a; --gris:#94a3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  header{
    background:var(--azulOscuro);padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(5,46,28,.2);
  }
  .logo{display:flex;align-items:center;gap:12px;height:64px;}
  .logo-icon{width:38px;height:38px;background:var(--cian);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0;}
  .logo-text{font-weight:800;font-size:17px;color:#fff;}
  .logo-text span{color:var(--cian2);}
  #sync-status{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;white-space:nowrap;}

  .tabs{display:flex;gap:4px;padding:0 0 8px;}
  .tab-btn{
    background:transparent;border:none;color:rgba(255,255,255,.6);font-family:var(--font);
    font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;
  }
  .tab-btn.active{background:var(--bg);color:var(--azul);}

  main{max-width:1180px;margin:0 auto;padding:22px 18px 90px;}
  .view{display:none;} .view.active{display:block;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,var(--azul));}
  .stat-card .num{font-size:26px;font-weight:900;line-height:1;}
  .stat-card .label{font-size:11.5px;color:var(--text2);margin-top:4px;font-weight:600;}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar select, .toolbar input[type=text], .toolbar input[type=date]{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;font-family:var(--font);font-size:13px;color:var(--text);font-weight:600;
  }
  .toolbar input[type=text]{flex:1;min-width:160px;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:var(--font);font-weight:700;
    font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--azul);color:#fff;}
  .btn-primary:hover{background:#12692f;}
  .btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--azul);color:var(--azul);}
  .btn-icon{padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text3);cursor:pointer;}
  .btn-icon:hover{border-color:var(--azul);color:var(--azul);}
  .spacer{flex:1;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .empty{text-align:center;padding:60px 20px;color:var(--text3);}
  .empty .e-icon{font-size:40px;margin-bottom:10px;}

  .act-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  }
  .act-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--urg,var(--verde));}
  .act-main{padding-left:6px;min-width:0;}
  .act-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px;}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em;}
  .badge-curso{background:#e8f9ef;color:var(--azul);}
  .badge-asig{background:#eef2ff;color:#4338ca;}
  .badge-equipo{background:#fff7ed;color:#c2410c;}
  .badge-done{background:#e8f9ef;color:var(--verde);}
  .act-title{font-weight:800;font-size:15px;margin-bottom:2px;}
  .act-sub{font-size:12.5px;color:var(--text2);}
  .act-dates{font-size:11.5px;color:var(--text3);margin-top:4px;}
  .act-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .tiempo-badge{font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap;color:#fff;background:var(--urg,var(--verde));}
  .act-actions{display:flex;gap:6px;}

  @media(max-width:640px){
    .act-card{grid-template-columns:1fr;}
    .act-right{flex-direction:row;justify-content:space-between;align-items:center;}
  }

  /* MODAL */
  .overlay{display:none;position:fixed;inset:0;background:rgba(5,46,28,.5);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadowG);}
  .modal h2{font-size:18px;font-weight:800;color:var(--azul);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
  .field input,.field select{
    width:100%;background:#f8fafc;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;font-family:var(--font);font-size:13.5px;color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--azul);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--azulOscuro);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;
    font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:999;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* AGENDA DEL DÍA */
  .agenda-head{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .agenda-day{font-size:26px;font-weight:800;color:var(--azul);text-transform:capitalize;}
  .agenda-sub{font-size:12px;color:var(--text2);margin-top:2px;}
  .agenda-nav{display:flex;align-items:center;gap:8px;}
  .grid6{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  @media(max-width:760px){.grid6{grid-template-columns:1fr;}}
  .abox{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:150px;
    display:flex;flex-direction:column;
  }
  .abox::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--urg,var(--verde));}
  .abox.vacio{align-items:center;justify-content:center;color:var(--text3);font-size:12.5px;min-height:110px;}
  .abox-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .abox-title{font-weight:800;font-size:13.5px;line-height:1.3;}
  .abox-sub{font-size:11.5px;color:var(--text2);margin-top:2px;}
  .abox-dates{font-size:10.5px;color:var(--text3);margin-top:2px;}
  .abox-check{
    width:22px;height:22px;border:2px solid var(--azul);border-radius:5px;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--azul);font-weight:900;
  }
  .abox-check:hover{background:#e8f9ef;}
  .abox-check.checked{background:var(--azul);color:#fff;}
  .abox textarea{
    flex:1;resize:none;border:none;background:transparent;font-family:var(--font);font-size:12.5px;
    color:var(--text);margin-top:6px;line-height:1.7;min-height:60px;
  }
  .abox textarea:focus{outline:none;}
  .overflow-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
  .overflow-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;font-size:12.5px;
  }
  .overflow-row .ov-title{flex:1;font-weight:700;}
  .notas-day{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .notas-day h3{font-size:13px;font-weight:800;color:var(--azul);margin-bottom:8px;}
  .notas-day textarea{
    width:100%;min-height:110px;border:1px solid var(--border);border-radius:10px;padding:10px;
    font-family:var(--font);font-size:13px;color:var(--text);resize:vertical;line-height:1.7;
  }
  .notas-day textarea:focus{outline:none;border-color:var(--azul);}

  /* ─── PLANTILLA DE IMPRESIÓN (oculta en pantalla) ─── */
  .print-page{display:none;}
  @media print{
    body *{visibility:hidden;}
    .print-page, .print-page *{visibility:visible;}
    .print-page{
      display:flex;flex-direction:column;position:absolute;left:0;top:0;
      width:210mm;min-height:297mm;padding:14mm 12mm;background:#fff;
    }
    @page{ size:A4; margin:0; }
  }
  .p-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--azul);padding-bottom:10px;}
  .p-month{font-size:14px;letter-spacing:1px;color:var(--cian);text-transform:capitalize;}
  .p-dayname{font-size:26px;font-weight:800;color:var(--azul);text-transform:capitalize;}
  .p-num{font-size:40px;font-weight:900;color:var(--azul);margin-left:10px;}
  .p-info{font-size:12px;color:#555;margin-top:4px;}
  .p-mcal{text-align:right;}
  .p-mcaltitle{font-size:12px;font-weight:700;color:var(--azul);text-transform:capitalize;margin-bottom:4px;}
  table.p-mcaltable{border-collapse:collapse;font-size:9px;}
  table.p-mcaltable th{background:var(--azul);color:#fff;padding:2px 5px;font-weight:600;}
  table.p-mcaltable td{padding:2px 5px;text-align:center;color:#444;}
  table.p-mcaltable td.today{background:var(--cian);color:#fff;font-weight:700;border-radius:3px;}
  table.p-mcaltable td.empty{color:transparent;}
  .p-activities{flex:1;display:flex;flex-direction:column;gap:5mm;margin-top:8mm;}
  .p-abox{
    flex:1;border:1.5px solid var(--azul);border-radius:2px;padding:6px 10px;min-height:24mm;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 7mm,var(--border) 7mm,var(--border) calc(7mm + 1px));
  }
  .p-ahead{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .p-atitle{font-size:11.5px;font-weight:800;color:var(--azul);text-transform:uppercase;letter-spacing:.3px;}
  .p-asub{font-size:10px;color:#666;margin-bottom:2px;}
  .p-check{width:5mm;height:5mm;border:1.5px solid var(--azul);border-radius:2px;flex-shrink:0;}
  .p-notes{margin-top:6mm;}
  .p-notes-title{font-size:12px;font-weight:700;color:var(--azul);margin-bottom:4px;}
  .p-notes-box{border:1.5px solid var(--azul);min-height:26mm;border-radius:2px;padding:6px 10px;font-size:11.5px;white-space:pre-wrap;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">W</div>
    <div class="logo-text">Agenda<span> Willismar</span></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="agenda" onclick="switchTab('agenda')">📅 Agenda del día</button>
    <button class="tab-btn" data-tab="academicas" onclick="switchTab('academicas')">🎓 Académicas</button>
    <button class="tab-btn" data-tab="reparaciones" onclick="switchTab('reparaciones')">🔧 Reparaciones</button>
  </div>
  <span id="sync-status">☁️ Sincronizando...</span>
</header>

<main>

  <!-- ============ VISTA: AGENDA DEL DÍA ============ -->
  <section class="view active" id="view-agenda">
    <div class="agenda-head">
      <div>
        <div class="agenda-day" id="ag-daylabel"></div>
        <div class="agenda-sub" id="ag-subinfo"></div>
      </div>
      <div class="agenda-nav">
        <button class="btn btn-ghost" onclick="agendaMoverDia(-1)">← Ayer</button>
        <input type="date" id="ag-fecha">
        <button class="btn btn-ghost" onclick="agendaMoverDia(1)">Mañana →</button>
        <button class="btn btn-primary" onclick="agendaIrHoy()">Hoy</button>
        <button class="btn btn-ghost" onclick="imprimirAgenda()">🖨️ Imprimir / PDF</button>
      </div>
    </div>

    <div class="grid6" id="ag-boxes"></div>

    <div class="notas-day">
      <h3>NOTAS DEL DÍA</h3>
      <textarea id="ag-notas" placeholder="Escribe aquí... cada línea empieza con ✓"></textarea>
    </div>
  </section>

  <!-- ============ VISTA: ACADÉMICAS ============ -->
  <section class="view" id="view-academicas">
    <div class="stat-row">
      <div class="stat-card" style="--accent:var(--azul)"><div class="num" id="st-a-total">0</div><div class="label">Total actividades</div></div>
      <div class="stat-card" style="--accent:var(--rojo)"><div class="num" id="st-a-urgente" style="color:var(--rojo)">0</div><div class="label">Urgentes (≤1 día)</div></div>
      <div class="stat-card" style="--accent:var(--amarillo)"><div class="num" id="st-a-semana" style="color:#b45309">0</div><div class="label">Esta semana</div></div>
      <div class="stat-card" style="--accent:var(--amarillo)"><div class="num" id="st-a-cobrar" style="color:#b45309">0</div><div class="label">Listas · por cobrar</div></div>
      <div class="stat-card" style="--accent:var(--verde)"><div class="num" id="st-a-completa" style="color:var(--verde)">0</div><div class="label">Entregadas y cobradas</div></div>
    </div>

    <div class="toolbar">
      <select id="fa-semestre"><option value="">Semestre: todos</option></select>
      <select id="fa-paralelo"><option value="">Paralelo: todos</option></select>
      <select id="fa-estudiante"><option value="">Estudiante: todos</option></select>
      <select id="fa-asignatura"><option value="">Asignatura: todas</option></select>
      <input type="text" id="fa-buscar" placeholder="Buscar actividad...">
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="btn-oc-acad">Ocultar completadas</button>
      <button class="btn btn-primary" onclick="abrirModalAcad()">＋ Nueva actividad</button>
    </div>

    <div class="list" id="lista-acad"></div>
  </section>

  <!-- ============ VISTA: REPARACIONES ============ -->
  <section class="view" id="view-reparaciones">
    <div class="stat-row">
      <div class="stat-card" style="--accent:var(--azul)"><div class="num" id="st-r-total">0</div><div class="label">Total trabajos</div></div>
      <div class="stat-card" style="--accent:var(--rojo)"><div class="num" id="st-r-urgente" style="color:var(--rojo)">0</div><div class="label">Urgentes (≤1 día)</div></div>
      <div class="stat-card" style="--accent:var(--amarillo)"><div class="num" id="st-r-semana" style="color:#b45309">0</div><div class="label">Esta semana</div></div>
      <div class="stat-card" style="--accent:var(--amarillo)"><div class="num" id="st-r-cobrar" style="color:#b45309">0</div><div class="label">Listos · por cobrar/retirar</div></div>
      <div class="stat-card" style="--accent:var(--verde)"><div class="num" id="st-r-completa" style="color:var(--verde)">0</div><div class="label">Entregados y cobrados</div></div>
    </div>

    <div class="toolbar">
      <select id="fr-equipo"><option value="">Equipo: todos</option><option>Laptop</option><option>PC de escritorio</option><option>Impresora</option><option>Otro</option></select>
      <input type="text" id="fr-buscar" placeholder="Buscar cliente o equipo...">
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="btn-oc-rep">Ocultar entregados</button>
      <button class="btn btn-primary" onclick="abrirModalRep()">＋ Nuevo trabajo</button>
    </div>

    <div class="list" id="lista-rep"></div>
  </section>

</main>

<!-- PLANTILLA DE IMPRESIÓN -->
<div class="print-page" id="print-page">
  <div class="p-top">
    <div>
      <div class="p-month" id="p-month"></div>
      <div class="p-dayname"><span id="p-daynametext"></span> <span class="p-num" id="p-daynum"></span></div>
      <div class="p-info" id="p-info"></div>
    </div>
    <div class="p-mcal">
      <div class="p-mcaltitle" id="p-mcaltitle"></div>
      <table class="p-mcaltable" id="p-mcaltable"></table>
    </div>
  </div>
  <div class="p-activities" id="p-activities"></div>
  <div class="p-notes">
    <div class="p-notes-title">NOTAS</div>
    <div class="p-notes-box" id="p-notes-box"></div>
  </div>
</div>


<!-- MODAL ACADÉMICA -->
<div class="overlay" id="overlay-acad">
  <div class="modal">
    <h2 id="modal-acad-title">Nueva actividad</h2>
    <div class="field-row">
      <div class="field"><label>Semestre</label><select id="m-semestre"></select></div>
      <div class="field"><label>Paralelo</label><select id="m-paralelo"><option>C1</option><option>C2</option><option>C3</option><option>C4</option></select></div>
    </div>
    <div class="field">
      <label>Estudiante</label>
      <input type="text" id="m-estudiante" list="dl-estudiantes" placeholder="Nombre del estudiante">
      <datalist id="dl-estudiantes"></datalist>
    </div>
    <div class="field">
      <label>Asignatura</label>
      <input type="text" id="m-asignatura" list="dl-asignaturas" placeholder="Ej: Auditoría de TI">
      <datalist id="dl-asignaturas"></datalist>
    </div>
    <div class="field"><label>Actividad</label><input type="text" id="m-actividad" placeholder="Ej: S3-Taller_1"></div>
    <div class="field"><label>Valor a cobrar (opcional)</label><input type="number" id="m-valor" step="0.01" min="0" placeholder="Ej: 15.00"></div>
    <div class="field-row">
      <div class="field"><label>Fecha de apertura</label><input type="date" id="m-apertura"></div>
      <div class="field"><label>Fecha de cierre</label><input type="date" id="m-cierre"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModalAcad()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarAcad()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL REPARACIÓN -->
<div class="overlay" id="overlay-rep">
  <div class="modal">
    <h2 id="modal-rep-title">Nuevo trabajo</h2>
    <div class="field">
      <label>Cliente</label>
      <input type="text" id="r-cliente" list="dl-clientes" placeholder="Nombre del cliente">
      <datalist id="dl-clientes"></datalist>
    </div>
    <div class="field">
      <label>Equipo</label>
      <select id="r-equipo"><option>Laptop</option><option>PC de escritorio</option><option>Impresora</option><option>Otro</option></select>
    </div>
    <div class="field"><label>Detalle (opcional)</label><input type="text" id="r-detalle" placeholder="Ej: no enciende, cambio de tóner..."></div>
    <div class="field"><label>Valor a cobrar (opcional)</label><input type="number" id="r-valor" step="0.01" min="0" placeholder="Ej: 25.00"></div>
    <div class="field-row">

// ─── UTILIDADES ────────────────────────────────────────────────
function fechaKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtValor(v){ return (v===undefined||v===null||v==='') ? '' : '$'+Number(v).toFixed(2); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }

function calcularUrgencia(fechaLimite, completada){
  if(completada) return { label:'Completada', color:'var(--gris)', dias:Infinity, vencida:false };
  const ahora = new Date();
  const limite = new Date(fechaLimite + 'T23:59:59');
  const msRestante = limite - ahora;
  if(msRestante < 0) return { label:'Venció', color:'var(--gris)', dias:-1, vencida:true };
  const dias = Math.floor(msRestante / 86400000);
  const horas = Math.floor((msRestante % 86400000) / 3600000);
  let color;
  if(dias <= 0) color = 'var(--rojo)';
  else if(dias === 1) color = 'var(--naranja)';
  else if(dias <= 3) color = 'var(--amarillo)';
  else color = 'var(--verde)';
  return { label:`Faltan ${dias} día${dias===1?'':'s'} y ${horas} h`, color, dias, vencida:false };
}

// ─── CHECKLIST (✓ automático) ──────────────────────────────────
function checklistFocus(e){
  const ta = e.target;
  if(!ta.value){ ta.value = '✓ '; ta.selectionStart = ta.selectionEnd = ta.value.length; }
}
function checklistKeydown(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const insert = '\n✓ ';
    ta.value = ta.value.slice(0,start) + insert + ta.value.slice(end);
    const pos = start + insert.length;
    ta.selectionStart = ta.selectionEnd = pos;
  }
}

// ═══════════════ AGENDA DEL DÍA ═══════════════
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function agendaMoverDia(delta){
  agendaFecha.setDate(agendaFecha.getDate()+delta);
  document.getElementById('ag-fecha').valueAsDate = agendaFecha;
  renderAgenda();
}
function agendaIrHoy(){

  document.getElementById('ag-fecha').valueAsDate = agendaFecha;
  renderAgenda();
}

// ─── IMPRESIÓN ─────────────────────────────────────────────────
function dayOfYear(d){ const start=new Date(d.getFullYear(),0,1); return Math.floor((d-start)/86400000)+1; }
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function daysInYear(y){ return isLeap(y)?366:365; }
function isoWeek(d){
  const date=new Date(d.getTime()); date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-((date.getDay()+6)%7));
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+((week1.getDay()+6)%7))/7);
}
function buildMiniCalHTML(d){
  const year=d.getFullYear(), month=d.getMonth();
  const first=new Date(year,month,1);
  let startOffset=(first.getDay()+6)%7;
  const totalDays=new Date(year,month+1,0).getDate();
  let html='<tr><th>L</th><th>M</th><th>M</th><th>J</th><th>V</th><th>S</th><th>D</th></tr>';
  let dayCounter=1, row=[];
  for(let i=0;i<startOffset;i++) row.push('<td class="empty">.</td>');
  while(dayCounter<=totalDays){
    const isToday=dayCounter===d.getDate();
    row.push(`<td class="${isToday?'today':''}">${dayCounter}</td>`);
    if(row.length===7){ html+='<tr>'+row.join('')+'</tr>'; row=[]; }
    dayCounter++;
  }
  if(row.length){ while(row.length<7) row.push('<td class="empty">.</td>'); html+='<tr>'+row.join('')+'</tr>'; }
  return html;
}

function imprimirAgenda(){
  const d = agendaFecha;
  document.getElementById('p-month').textContent = MESES[d.getMonth()];
  document.getElementById('p-daynametext').textContent = DIAS[d.getDay()];
  document.getElementById('p-daynum').textContent = d.getDate();
  const doy = dayOfYear(d), restante = daysInYear(d.getFullYear())-doy, semana = isoWeek(d);
  document.getElementById('p-info').textContent = `Día ${doy}/${restante} · Semana ${semana} · ${d.getFullYear()}`;
  document.getElementById('p-mcaltitle').textContent = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById('p-mcaltable').innerHTML = buildMiniCalHTML(d);

  const items = pendientesDelDia(d);
  const cont = document.getElementById('p-activities');
  if(!items.length){
    cont.innerHTML = `<div class="p-abox" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">Sin actividades pendientes</div>`;
  } else {
    cont.innerHTML = items.map(it=>`
      <div class="p-abox">
        <div class="p-ahead">
          <div>
            <div class="p-atitle">${it.titulo}</div>
            <div class="p-asub">${it.sub} — ${it.fechas}</div>
          </div>
          <div class="p-check"></div>
        </div>
      </div>`).join('');
  }
  document.getElementById('p-notes-box').textContent = notasAgenda[fechaKey(d)] || '';

  window.print();
}

function pendientesDelDia(fechaSel){
  const key = fechaKey(fechaSel);
  const items = [];
  actividades.forEach(a=>{
    if(a.entregada || a.listo) return;
    if(!a.apertura || !a.cierre) return;
    if(key >= a.apertura && key <= a.cierre){
      items.push({ tipo:'acad', ref:a, id:a.id,
        titulo:`${escapeHtml(a.asignatura)} — ${escapeHtml(a.actividad)}`,
        sub:`🧑‍🎓 ${escapeHtml(a.estudiante||'Sin asignar')} · ${a.semestre}°${a.paralelo}${a.valor?' · '+fmtValor(a.valor):''}`,
        fechas:`Apertura: ${fmt(a.apertura)} · Cierre: ${fmt(a.cierre)}`,
        urg: calcularUrgencia(a.cierre, false) });
    }
  });
  reparaciones.forEach(r=>{
    if(r.entregado) return;
    if(!r.ingreso || !r.entrega) return;
    if(key >= r.ingreso && key <= r.entrega && !r.listo){
      items.push({ tipo:'rep', ref:r, id:r.id,
        titulo:`🔧 ${escapeHtml(r.cliente)} — ${escapeHtml(r.equipo)}`,
        sub: (r.detalle ? escapeHtml(r.detalle) : 'Sin detalle') + (r.valor ? ' · '+fmtValor(r.valor) : ''),
        fechas:`Ingreso: ${fmt(r.ingreso)} · Entrega: ${fmt(r.entrega)}`,
        urg: calcularUrgencia(r.entrega, false) });
    }
  });
  items.sort((a,b)=> a.urg.dias - b.urg.dias);
  return items.slice(0,6);
}

function renderAgenda(){
  const key = fechaKey(agendaFecha);
  document.getElementById('ag-daylabel').textContent = `${DIAS[agendaFecha.getDay()]} ${agendaFecha.getDate()} de ${MESES[agendaFecha.getMonth()]}`;
  document.getElementById('ag-subinfo').textContent = agendaFecha.getFullYear();

  const boxes = pendientesDelDia(agendaFecha);

  const cont = document.getElementById('ag-boxes');
  if(!boxes.length){
    cont.innerHTML = `<div class="abox vacio" style="grid-column:1/-1">📋 Sin actividades pendientes para este día.</div>`;
  } else {
    cont.innerHTML = boxes.map(it=>`
      <div class="abox" style="--urg:${it.urg.color}">
        <div class="abox-head">
          <div>
            <div class="abox-title">${it.titulo}</div>
            <div class="abox-sub">${it.sub}</div>
            <div class="abox-dates">${it.fechas}</div>
          </div>
          <div class="abox-check" title="Marcar como realizada" onclick="agendaMarcar(this,'${it.tipo}','${it.id}')"></div>
        </div>
        <textarea placeholder="Escribe aquí... (✓ automático)" data-tipo="${it.tipo}" data-id="${it.id}"
          onfocus="checklistFocus(event)" onkeydown="checklistKeydown(event)" oninput="agendaNotaInput(event)">${escapeHtml(it.ref.notas||'')}</textarea>
      </div>`).join('');
  }

  document.getElementById('ag-notas').value = notasAgenda[key] || '';
}

function agendaMarcar(el, tipo, id){
  el.classList.add('checked');
  el.innerHTML = '✓';
  el.onclick = null;
  setTimeout(()=>{
    if(tipo==='acad'){ const a=actividades.find(x=>x.id===id); if(a){ a.listo=true; } fbGuardarAcad(); }
    else { const r=reparaciones.find(x=>x.id===id); if(r){ r.listo=true; } fbGuardarRep(); }
    guardarLocal(); renderAgenda(); renderAcad(); renderRep();
    toast(tipo==='rep' ? 'Trabajo terminado — recuerda registrar la entrega/cobro en Reparaciones' : 'Actividad terminada — recuerda registrar el cobro en Académicas');
  }, 350);
}

const agendaNotaInput = debounce(function(e){
  const ta = e.target;
  const tipo = ta.dataset.tipo, id = ta.dataset.id;
  if(tipo==='acad'){ const a=actividades.find(x=>x.id===id); if(a){ a.notas = ta.value; guardarLocal(); fbGuardarAcad(); } }
  else { const r=reparaciones.find(x=>x.id===id); if(r){ r.notas = ta.value; guardarLocal(); fbGuardarRep(); } }
}, 700);

const guardarNotaDia = debounce(function(){
  const key = fechaKey(agendaFecha);
  notasAgenda[key] = document.getElementById('ag-notas').value;
  guardarLocal(); fbGuardarNotas();
}, 700);

document.getElementById('ag-notas').addEventListener('focus', checklistFocus);
document.getElementById('ag-notas').addEventListener('keydown', checklistKeydown);
document.getElementById('ag-notas').addEventListener('input', guardarNotaDia);
document.getElementById('ag-fecha').addEventListener('change', function(){
  if(this.valueAsDate){
    const p = this.value.split('-').map(Number);
    agendaFecha = new Date(p[0], p[1]-1, p[2]);
    renderAgenda();
  }
});

// ═══════════════ ACADÉMICAS ═══════════════
function fillSelectsAcad(){
  const semSel = document.getElementById('m-semestre');
  if(!semSel.options.length){ for(let i=1;i<=10;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'° semestre'; semSel.appendChild(o); } }

  const fSem = document.getElementById('fa-semestre'); const semActual = fSem.value;
  fSem.innerHTML = '<option value="">Semestre: todos</option>';
  for(let i=1;i<=10;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'° semestre'; fSem.appendChild(o); }
  fSem.value = semActual;

  const fPar = document.getElementById('fa-paralelo'); const parActual = fPar.value;
  fPar.innerHTML = '<option value="">Paralelo: todos</option>' + ['C1','C2','C3','C4'].map(p=>`<option>${p}</option>`).join('');
  fPar.value = parActual;

  const estudiantes = [...new Set(actividades.map(a=>a.estudiante).filter(Boolean))].sort();
  const fEst = document.getElementById('fa-estudiante'); const estActual = fEst.value;
  fEst.innerHTML = '<option value="">Estudiante: todos</option>' + estudiantes.map(e=>`<option>${e}</option>`).join('');
  fEst.value = estActual;
  document.getElementById('dl-estudiantes').innerHTML = estudiantes.map(e=>`<option value="${escapeHtml(e)}">`).join('');

  const asignaturas = [...new Set(actividades.map(a=>a.asignatura).filter(Boolean))].sort();
  const fAsig = document.getElementById('fa-asignatura'); const asigActual = fAsig.value;
  fAsig.innerHTML = '<option value="">Asignatura: todas</option>' + asignaturas.map(a=>`<option>${a}</option>`).join('');
  fAsig.value = asigActual;
  document.getElementById('dl-asignaturas').innerHTML = asignaturas.map(a=>`<option value="${escapeHtml(a)}">`).join('');
}

function renderAcad(){
  fillSelectsAcad();
  const fSem = document.getElementById('fa-semestre').value;
  const fPar = document.getElementById('fa-paralelo').value;
  const fEst = document.getElementById('fa-estudiante').value;
  const fAsig = document.getElementById('fa-asignatura').value;
  const fBuscar = document.getElementById('fa-buscar').value.trim().toLowerCase();

  let filtradas = actividades.filter(a=>{
    if(fSem && String(a.semestre) !== fSem) return false;
    if(fPar && a.paralelo !== fPar) return false;
    if(fEst && a.estudiante !== fEst) return false;
    if(fAsig && a.asignatura !== fAsig) return false;
    if(fBuscar && !(a.actividad.toLowerCase().includes(fBuscar) || a.asignatura.toLowerCase().includes(fBuscar))) return false;
    if(ocultarCompletasAcad && a.entregada) return false;
    return true;
  });
  const pesoA = a => a.entregada ? 2 : (a.listo ? 1 : 0);
  filtradas.sort((a,b)=>{
    const pa=pesoA(a), pb=pesoA(b);
    if(pa!==pb) return pa-pb;
    if(pa===0) return calcularUrgencia(a.cierre,false).dias - calcularUrgencia(b.cierre,false).dias;
    return 0;
  });

  const lista = document.getElementById('lista-acad');
  if(!filtradas.length){ lista.innerHTML = `<div class="empty"><div class="e-icon">📋</div>No hay actividades que coincidan.</div>`; }
  else {
    lista.innerHTML = filtradas.map(a=>{
      let urg;
      if(a.entregada) urg = { label:'Entregada y cobrada', color:'var(--gris)' };
      else if(a.listo) urg = { label:'Por cobrar', color:'var(--amarillo)' };
      else urg = calcularUrgencia(a.cierre, false);

      let badgeEstado = '';
      if(a.entregada) badgeEstado = '<span class="badge badge-done">✔ Entregada y cobrada</span>';
      else if(a.listo) badgeEstado = '<span class="badge" style="background:#fef3c7;color:#b45309;">🟡 Lista · por cobrar</span>';

      let iconAccion, tituloAccion;
      if(a.entregada){ iconAccion='↺'; tituloAccion='Volver a pendiente'; }
      else if(a.listo){ iconAccion='💰'; tituloAccion='Marcar entregada y cobrada'; }
      else { iconAccion='✔'; tituloAccion='Marcar terminada (lista)'; }

      return `
      <div class="act-card" style="--urg:${urg.color}">
        <div class="act-main">
          <div class="act-top">
            <span class="badge badge-curso">${a.semestre}° · ${a.paralelo}</span>
            <span class="badge badge-asig">${escapeHtml(a.asignatura)}</span>
            ${a.valor ? `<span class="badge" style="background:#ecfdf5;color:#047857;">${fmtValor(a.valor)}</span>` : ''}
            ${badgeEstado}
          </div>
          <div class="act-title">${escapeHtml(a.actividad)}</div>
          <div class="act-sub">🧑‍🎓 ${escapeHtml(a.estudiante || 'Sin asignar')}</div>
          <div class="act-dates">Apertura: ${fmt(a.apertura)} · Cierre: ${fmt(a.cierre)}</div>
        </div>
        <div class="act-right">
          <span class="tiempo-badge" style="--urg:${urg.color}">${urg.label}</span>
          <div class="act-actions">
            <button class="btn-icon" title="${tituloAccion}" onclick="ciclarEstadoAcad('${a.id}')">${iconAccion}</button>
            <button class="btn-icon" title="Editar" onclick="abrirModalAcad('${a.id}')">✎</button>
            <button class="btn-icon" title="Eliminar" onclick="eliminarAcad('${a.id}')">🗑</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('st-a-total').textContent = actividades.length;
  document.getElementById('st-a-urgente').textContent = actividades.filter(a=>!a.entregada && !a.listo && calcularUrgencia(a.cierre,false).dias<=1 && !calcularUrgencia(a.cierre,false).vencida).length;
  document.getElementById('st-a-semana').textContent = actividades.filter(a=>!a.entregada && !a.listo && calcularUrgencia(a.cierre,false).dias>=0 && calcularUrgencia(a.cierre,false).dias<=7).length;
  document.getElementById('st-a-cobrar').textContent = actividades.filter(a=>a.listo && !a.entregada).length;
  document.getElementById('st-a-completa').textContent = actividades.filter(a=>a.entregada).length;
}

function abrirModalAcad(id){
  editandoAcadId = id || null;
  fillSelectsAcad();
  document.getElementById('modal-acad-title').textContent = id ? 'Editar actividad' : 'Nueva actividad';
  if(id){
    const a = actividades.find(x=>x.id===id);
    document.getElementById('m-semestre').value = a.semestre;
    document.getElementById('m-paralelo').value = a.paralelo;
    document.getElementById('m-estudiante').value = a.estudiante;
    document.getElementById('m-asignatura').value = a.asignatura;
    document.getElementById('m-actividad').value = a.actividad;
    document.getElementById('m-valor').value = a.valor !== undefined && a.valor !== null ? a.valor : '';
    document.getElementById('m-apertura').value = a.apertura;
    document.getElementById('m-cierre').value = a.cierre;
  } else {
    ['m-estudiante','m-asignatura','m-actividad','m-valor','m-apertura','m-cierre'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('m-semestre').value = 1;
    document.getElementById('m-paralelo').value = 'C1';
  }
  document.getElementById('overlay-acad').classList.add('show');
}
function cerrarModalAcad(){ document.getElementById('overlay-acad').classList.remove('show'); editandoAcadId = null; }

function guardarAcad(){
  const semestre = document.getElementById('m-semestre').value;
  const paralelo = document.getElementById('m-paralelo').value;
  const estudiante = document.getElementById('m-estudiante').value.trim();
  const asignatura = document.getElementById('m-asignatura').value.trim();
  const actividad = document.getElementById('m-actividad').value.trim();
  const valorRaw = document.getElementById('m-valor').value;
  const valor = valorRaw === '' ? null : parseFloat(valorRaw);
  const apertura = document.getElementById('m-apertura').value;
  const cierre = document.getElementById('m-cierre').value;
  if(!asignatura || !actividad || !cierre){ toast('Completa al menos asignatura, actividad y fecha de cierre', 'warn'); return; }

  if(editandoAcadId){
    const a = actividades.find(x=>x.id===editandoAcadId);
    Object.assign(a, { semestre, paralelo, estudiante, asignatura, actividad, valor, apertura, cierre });
  } else {
    actividades.push({ id:'a'+Date.now()+Math.random().toString(36).slice(2,7), semestre, paralelo, estudiante, asignatura, actividad, valor, apertura, cierre, listo:false, entregada:false, notas:'' });
  }
  guardarLocal(); fbGuardarAcad(); renderTodo(); cerrarModalAcad();
  toast('Actividad guardada');
}
function eliminarAcad(id){
  if(!confirm('¿Eliminar esta actividad?')) return;
  actividades = actividades.filter(a=>a.id!==id);
  guardarLocal(); fbGuardarAcad(); renderTodo();
  toast('Actividad eliminada', 'warn');
}
function ciclarEstadoAcad(id){
  const a = actividades.find(x=>x.id===id);
  if(!a.listo && !a.entregada){ a.listo = true; toast('Actividad terminada — falta que te la cobren'); }
  else if(a.listo && !a.entregada){ a.entregada = true; toast('Registrada como entregada y cobrada'); }
  else { a.listo = false; a.entregada = false; toast('Vuelta a pendiente', 'warn'); }
  guardarLocal(); fbGuardarAcad(); renderTodo();
}

// ═══════════════ REPARACIONES ═══════════════
function fillSelectsRep(){
  const clientes = [...new Set(reparaciones.map(r=>r.cliente).filter(Boolean))].sort();
  document.getElementById('dl-clientes').innerHTML = clientes.map(c=>`<option value="${escapeHtml(c)}">`).join('');
}

function renderRep(){
  fillSelectsRep();
  const fEquipo = document.getElementById('fr-equipo').value;
  const fBuscar = document.getElementById('fr-buscar').value.trim().toLowerCase();

  let filtradas = reparaciones.filter(r=>{
    if(fEquipo && r.equipo !== fEquipo) return false;
    if(fBuscar && !(r.cliente.toLowerCase().includes(fBuscar) || r.equipo.toLowerCase().includes(fBuscar) || (r.detalle||'').toLowerCase().includes(fBuscar))) return false;
    if(ocultarCompletasRep && r.entregado) return false;
    return true;
  });
  const peso = r => r.entregado ? 2 : (r.listo ? 1 : 0);
  filtradas.sort((a,b)=>{
    const pa=peso(a), pb=peso(b);
    if(pa!==pb) return pa-pb;
    if(pa===0) return calcularUrgencia(a.entrega,false).dias - calcularUrgencia(b.entrega,false).dias;
    return 0;
  });

  const lista = document.getElementById('lista-rep');
  if(!filtradas.length){ lista.innerHTML = `<div class="empty"><div class="e-icon">🔧</div>No hay trabajos que coincidan.</div>`; }
  else {
    lista.innerHTML = filtradas.map(r=>{
      let urg;
      if(r.entregado) urg = { label:'Entregado y cobrado', color:'var(--gris)' };
      else if(r.listo) urg = { label:'Por retirar/cobrar', color:'var(--amarillo)' };
      else urg = calcularUrgencia(r.entrega, false);

      let badgeEstado = '';
      if(r.entregado) badgeEstado = '<span class="badge badge-done">✔ Entregado y cobrado</span>';
      else if(r.listo) badgeEstado = '<span class="badge" style="background:#fef3c7;color:#b45309;">🟡 Listo · por retirar/cobrar</span>';

      let iconAccion, tituloAccion;
      if(r.entregado){ iconAccion='↺'; tituloAccion='Volver a pendiente'; }
      else if(r.listo){ iconAccion='💰'; tituloAccion='Marcar entregado y cobrado'; }
      else { iconAccion='✔'; tituloAccion='Marcar terminado (listo)'; }

      return `
      <div class="act-card" style="--urg:${urg.color}">
        <div class="act-main">
          <div class="act-top">
            <span class="badge badge-equipo">${escapeHtml(r.equipo)}</span>
            ${r.valor ? `<span class="badge" style="background:#ecfdf5;color:#047857;">${fmtValor(r.valor)}</span>` : ''}
            ${badgeEstado}
          </div>
          <div class="act-title">${escapeHtml(r.cliente)}</div>
          <div class="act-sub">${escapeHtml(r.detalle || 'Sin detalle')}</div>
          <div class="act-dates">Ingreso: ${fmt(r.ingreso)} · Entrega: ${fmt(r.entrega)}</div>
        </div>
        <div class="act-right">
          <span class="tiempo-badge" style="--urg:${urg.color}">${urg.label}</span>
          <div class="act-actions">
            <button class="btn-icon" title="${tituloAccion}" onclick="ciclarEstadoRep('${r.id}')">${iconAccion}</button>
            <button class="btn-icon" title="Editar" onclick="abrirModalRep('${r.id}')">✎</button>
            <button class="btn-icon" title="Eliminar" onclick="eliminarRep('${r.id}')">🗑</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('st-r-total').textContent = reparaciones.length;
  document.getElementById('st-r-urgente').textContent = reparaciones.filter(r=>!r.listo && !r.entregado && calcularUrgencia(r.entrega,false).dias<=1 && !calcularUrgencia(r.entrega,false).vencida).length;
  document.getElementById('st-r-semana').textContent = reparaciones.filter(r=>!r.listo && !r.entregado && calcularUrgencia(r.entrega,false).dias>=0 && calcularUrgencia(r.entrega,false).dias<=7).length;
  document.getElementById('st-r-cobrar').textContent = reparaciones.filter(r=>r.listo && !r.entregado).length;
  document.getElementById('st-r-completa').textContent = reparaciones.filter(r=>r.entregado).length;
}

function abrirModalRep(id){
  editandoRepId = id || null;
  fillSelectsRep();
  document.getElementById('modal-rep-title').textContent = id ? 'Editar trabajo' : 'Nuevo trabajo';
  if(id){
    const r = reparaciones.find(x=>x.id===id);
    document.getElementById('r-cliente').value = r.cliente;
    document.getElementById('r-equipo').value = r.equipo;
    document.getElementById('r-detalle').value = r.detalle || '';
    document.getElementById('r-valor').value = r.valor !== undefined && r.valor !== null ? r.valor : '';
    document.getElementById('r-ingreso').value = r.ingreso;
    document.getElementById('r-entrega').value = r.entrega;
  } else {
    ['r-cliente','r-detalle','r-valor','r-ingreso','r-entrega'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('r-equipo').value = 'Laptop';
  }
  document.getElementById('overlay-rep').classList.add('show');
}
function cerrarModalRep(){ document.getElementById('overlay-rep').classList.remove('show'); editandoRepId = null; }

function guardarRep(){
  const cliente = document.getElementById('r-cliente').value.trim();
  const equipo = document.getElementById('r-equipo').value;
  const detalle = document.getElementById('r-detalle').value.trim();
  const valorRaw = document.getElementById('r-valor').value;
  const valor = valorRaw === '' ? null : parseFloat(valorRaw);
  const ingreso = document.getElementById('r-ingreso').value;
  const entrega = document.getElementById('r-entrega').value;
  if(!cliente || !ingreso || !entrega){ toast('Completa al menos cliente, fecha de ingreso y de entrega', 'warn'); return; }

  if(editandoRepId){
    const r = reparaciones.find(x=>x.id===editandoRepId);
    Object.assign(r, { cliente, equipo, detalle, valor, ingreso, entrega });
  } else {
    reparaciones.push({ id:'r'+Date.now()+Math.random().toString(36).slice(2,7), cliente, equipo, detalle, valor, ingreso, entrega, listo:false, entregado:false, notas:'' });
  }
  guardarLocal(); fbGuardarRep(); renderTodo(); cerrarModalRep();
  toast('Trabajo guardado');
}
function eliminarRep(id){
  if(!confirm('¿Eliminar este trabajo?')) return;
  reparaciones = reparaciones.filter(r=>r.id!==id);
  guardarLocal(); fbGuardarRep(); renderTodo();
  toast('Trabajo eliminado', 'warn');
}
function ciclarEstadoRep(id){
  const r = reparaciones.find(x=>x.id===id);
  if(!r.listo && !r.entregado){ r.listo = true; toast('Trabajo marcado como terminado — falta que retire/pague'); }
  else if(r.listo && !r.entregado){ r.entregado = true; toast('Registrado como entregado y cobrado'); }
  else { r.listo = false; r.entregado = false; toast('Vuelto a pendiente', 'warn'); }
  guardarLocal(); fbGuardarRep(); renderTodo();
}

// ─── GENERAL ───────────────────────────────────────────────────
function toast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = tipo==='warn' ? 'var(--naranja)' : 'var(--azulOscuro)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function renderTodo(){ renderAgenda(); renderAcad(); renderRep(); }

// ─── EVENTOS ───────────────────────────────────────────────────
['fa-semestre','fa-paralelo','fa-estudiante','fa-asignatura'].forEach(id=>document.getElementById(id).addEventListener('change', renderAcad));
document.getElementById('fa-buscar').addEventListener('input', renderAcad);
document.getElementById('btn-oc-acad').addEventListener('click', function(){
  ocultarCompletasAcad = !ocultarCompletasAcad;
  this.textContent = ocultarCompletasAcad ? 'Mostrar completadas' : 'Ocultar completadas';
  renderAcad();
});
document.getElementById('fr-equipo').addEventListener('change', renderRep);
document.getElementById('fr-buscar').addEventListener('input', renderRep);
document.getElementById('btn-oc-rep').addEventListener('click', function(){
  ocultarCompletasRep = !ocultarCompletasRep;
  this.textContent = ocultarCompletasRep ? 'Mostrar entregados' : 'Ocultar entregados';
  renderRep();
});
document.getElementById('overlay-acad').addEventListener('click', e=>{ if(e.target.id==='overlay-acad') cerrarModalAcad(); });
document.getElementById('overlay-rep').addEventListener('click', e=>{ if(e.target.id==='overlay-rep') cerrarModalRep(); });

// ─── INIT ──────────────────────────────────────────────────────
document.getElementById('ag-fecha').valueAsDate = agendaFecha;
renderTodo();
fbCargarTodo();
setInterval(renderTodo, 60000);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-actividades.js').catch(e=>console.log('SW:',e));
}
</script>
